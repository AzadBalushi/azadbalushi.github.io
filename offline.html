<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>You're Offline · Azad Balushi</title>
  <meta name="theme-color" content="#12809B" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      display:grid;place-items:center;min-height:100vh;
      background:radial-gradient(120% 90% at 50% 18%,#ffffff 0%,#f4fafb 55%,#eaf4f6 100%);
      color:#142d3b;padding:24px;
    }
    .card{
      max-width:440px;text-align:center;padding:48px 32px;border-radius:24px;
      background:#fff;box-shadow:0 16px 48px rgba(8,127,149,.16),0 2px 6px rgba(8,127,149,.08);
    }
    .icon{
      display:inline-grid;place-items:center;width:72px;height:72px;border-radius:20px;
      background:linear-gradient(135deg,#087f95,#5dd8df);margin-bottom:24px;
    }
    .icon svg{width:36px;height:36px;color:#fff}
    h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
    p{font-size:15px;line-height:1.6;color:#4d626a;margin-bottom:24px}
    .btn{
      display:inline-block;padding:12px 24px;border-radius:999px;background:#087f95;
      color:#fff;text-decoration:none;font-weight:600;font-size:14px;transition:background .2s;
    }
    .btn:hover{background:#065f70}
    .hint{margin-top:20px;font-size:12px;color:#8a9ba1}
    @media (prefers-color-scheme:dark){
      body{background:radial-gradient(120% 90% at 50% 18%,#0d1f27 0%,#071820 55%,#050f14 100%)}
      .card{background:#0f2530;box-shadow:0 16px 48px rgba(0,0,0,.4)}
      h1{color:#f0f7f8}
      p{color:#b3c9ce}
      .hint{color:#5a747a}
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>The page you're looking for hasn't been saved for offline use yet. Once you visit it while online, it will be available here even without a connection.</p>
    <a href="/" class="btn">Go to Home</a>
    <p class="hint">If you just lost connection, try again in a moment.</p>
  </div>
</body>
</html>
