<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12809B" />
  <title>Offline — Azad Balushi Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #EAF7FA 0%, #F7FBFC 40%, #ffffff 100%);
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 480px;
      text-align: center;
    }
    .logo {
      width: 128px;
      height: 128px;
      margin: 0 auto 2.5rem;
      display: block;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #12809B;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 1.0625rem;
      line-height: 1.6;
      color: #555;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #12809B;
      color: #fff;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.9375rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #0e6a82; }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(160deg, #003A52 0%, #0a0a14 60%, #0a0a14 100%); color: #e4e4e7; }
      h1 { color: #1ba8cc; }
      p { color: #a1a1aa; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/AB_Logo.png" alt="Azad Balushi logo" class="logo" />
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. Pages you've previously
      visited are still available. Please reconnect to access the full portfolio.
    </p>
    <a href="/" class="btn">Try Again</a>
  </div>
</body>
</html>
